name: Bug 报告 / Bug report
description: 报告一个能够复现的软件问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传私人媒体；安全漏洞请使用 Private Vulnerability Reporting。
  - type: input
    id: version
    attributes:
      label: zClip 版本
      placeholder: 例如 2.5.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: input
    id: media
    attributes:
      label: 素材信息
      description: 请填写格式、编码、分辨率、时长等可公开信息。
      placeholder: 例如 MP4 / H.264 / AAC / 1920x1080 / 30 FPS
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 导入……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附截图、日志或可公开的最小复现素材链接。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 和 Discussion。
          required: true
        - label: 这里不包含密码、私人素材或安全漏洞细节。
          required: true
